<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>EB勉強タイマー</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e3a8a; transition: background-color 0.3s;
        }
        #app {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center;
            position: relative;
        }
        #status { font-size: 32px; font-weight: bold; margin-bottom: 20px; }
        #hint { font-size: 18px; opacity: 0.7; }
        #version {
            position: absolute; bottom: 15px; right: 15px;
            font-size: 12px; opacity: 0.4; font-family: monospace;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="status">画面をタップして開始</div>
    <div id="hint">集中を維持しましょう</div>
    <div id="version">Ver 2.1 (0秒ジリジリ＋低音リミックス版)</div>
</div>

<script>
const MAX_TIME = 60;
let timeRemaining = MAX_TIME;
let timerId = null;
let alertId = null;
let wakeLock = null;

const app = document.getElementById('app');
const statusText = document.getElementById('status');
const hintText = document.getElementById('hint');

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine') {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = type;
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    
    setTimeout(() => {
        osc.stop();
    }, duration * 1000);
}

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {
        console.log("WakeLock failed", err);
    }
}

function startTimer() {
    clearInterval(timerId);
    clearInterval(alertId);
    timeRemaining = MAX_TIME;
    
    document.body.style.backgroundColor = '#1e3a8a';
    statusText.innerText = '集中タイム';
    hintText.innerText = '集中が切れたら画面をタップしてリセット';
    
    requestWakeLock();

    timerId = setInterval(() => {
        if (timeRemaining > 0) {
            timeRemaining--;

            // 残り10秒：画面の色（オレンジ）と文字だけ変更（音はなし）
            if (timeRemaining === 10) {
                document.body.style.backgroundColor = '#d97706'; 
                statusText.innerText = '警告：集中が切れていませんか？';
            }
            
            // 残り5秒：びっくりする警告音（ブッ）を0.5秒間鳴らす
            if (timeRemaining === 5) {
                playTone(220, 0.5, 'sawtooth'); 
            }
            
        } else {
            // 0秒：タイムアウト（ジリジリ音と太い低音の同時超高速連打）
            clearInterval(timerId);
            document.body.style.backgroundColor = '#dc2626';
            statusText.innerText = '⚠️ タイムアウト ⚠️';
            hintText.innerText = 'タップして再開してください';
            
            // カウントを刻むための変数
            let tick = 0;
            
            // 0.05秒（50ミリ秒）ごとに超高速処理
            alertId = setInterval(() => {
                // 【ジリジリ音】1200Hzの硬い金属音を常に50ミリ秒ごとに超連打
                playTone(1200, 0.03, 'square');
                
                // 【びっくり低音】300ミリ秒（0.3秒）に1回のペースで重低音を重ねていく（ウー！ウー！）
                if (tick % 6 === 0) {
                    playTone(220, 0.2, 'sawtooth');
                }
                
                tick++;
            }, 50);
        }
    }, 1000);
}

app.addEventListener('click', () => {
    initAudio();
    startTimer();
});
</script>

</body>
</html>
