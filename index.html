<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>EB居眠り防止タイマー</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1e3a8a; transition: background-color 0.3s;
        }
        #app {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; text-align: center;
            position: relative;
        }
        #status { font-size: 24px; font-weight: 500; margin-bottom: 20px; }
        #timer { font-size: 140px; font-weight: 900; font-family: monospace; line-height: 1; }
        #hint { font-size: 18px; opacity: 0.7; margin-top: 40px; }
        /* 【追加】バージョン表示のスタイル */
        #version {
            position: absolute; bottom: 15px; right: 15px;
            font-size: 12px; opacity: 0.4; font-family: monospace;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="status">生存確認中</div>
    <div id="timer">60</div>
    <div id="hint">画面をタップしてスタート / リセット</div>
    <!-- 【追加】右下にバージョンを表示 -->
    <div id="version">Ver 1.1 (ジリジリ音版)</div>
</div>

<script>
const MAX_TIME = 60;
let timeRemaining = MAX_TIME;
let timerId = null;
let alertId = null;
let wakeLock = null;

const app = document.getElementById('app');
const timerText = document.getElementById('timer');
const statusText = document.getElementById('status');

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
}

function playTone(freq, duration, type = 'sine') {
    initAudio();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = type;
    osc.frequency.value = freq;
    
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    
    setTimeout(() => {
        osc.stop();
    }, duration * 1000);
}

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {
        console.log("WakeLock failed", err);
    }
}

function startTimer() {
    clearInterval(timerId);
    clearInterval(alertId);
    timeRemaining = MAX_TIME;
    
    document.body.style.backgroundColor = '#1e3a8a';
    statusText.innerText = '生存確認中';
    timerText.innerText = timeRemaining;
    
    requestWakeLock();

    timerId = setInterval(() => {
        if (timeRemaining > 0) {
            timeRemaining--;
            timerText.innerText = timeRemaining;

            // 残り10秒・5秒：低めのブザー音（ブッ）
            if (timeRemaining === 10 || timeRemaining === 5) {
                document.body.style.backgroundColor = '#d97706';
                statusText.innerText = '警告：起きてください！';
                playTone(220, 0.2, 'sawtooth'); 
            }
        } else {
            // 0秒：非常ブレーキ（目覚まし時計のジリジリ音）
            clearInterval(timerId);
            document.body.style.backgroundColor = '#dc2626';
            statusText.innerText = '⚠️ 非常ブレーキ作動 ⚠️';
            
            alertId = setInterval(() => {
                playTone(1200, 0.03, 'square');
            }, 50);
        }
    }, 1000);
}

app.addEventListener('click', () => {
    initAudio();
    startTimer();
});
</script>

</body>
</html>
